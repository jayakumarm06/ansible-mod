- name: shell vs command
  hosts: local
  connection: local
  tasks:
    - name: test the command
      # command: cat /etc/password | grep roboshop
      shell: cat /etc/passwd | grep roboshop
      register: roboshop_output

    - name: print the output
      debug:
        msg: "{{ roboshop_output }}"

    - name: get the files
      # command: ls -la > /tmp/files.txt
      shell: ls -la > /tmp/files.txt
      register: files_output

    - name: print files info
      debug:
        msg: "{{ files_output }}"
