- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Linux shell ansbile terraform docker"
    names:
      - jai
      - kumar
      - menda
    topic: ANSIBLE
    duration: "4"
  tasks:
    - name: print the name
      debug:
        msg: "Hi, {{ person_name | default('deephti') }}"

    - name: convert the string to list
      debug:
        msg: "Topics are: {{ topics | split(' ') | trim }}"

    - name: convert list to string
      debug:
        msg: "Full name: {{ names | join(' ') }}"

    - name: convert the lower case
      debug:
        msg: "Topic: {{ topic | lower }}"
