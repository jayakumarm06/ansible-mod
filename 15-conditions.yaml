- name: Print Os is Redhat or not
  hosts: local
  connection: local
  become: yes

  tasks:
    - name: Install nginx in Redhat
      dnf:
        name: nginx
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Install nignx in Debain
      apt:
        name: nginx
        state: present
      when: ansible_facts.os_family == "Debain"
