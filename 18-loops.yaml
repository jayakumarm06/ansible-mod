- name: install packages
  hosts: local
  connection: local
  become: yes

  vars:
    packages:
      - { name: "nginx", state: "absent" }
      - { name: "git", state: "present" }
      - { name: "mysql", state: "present" }
      - { name: "htop", state: "absent" }
      - { name: "net-tools", state: "present" }
  tasks:
    - name: Install packages
      package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ packages }}"
